[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "career_compiler"
version = "0.1.0"
description = "A generative-AI resume and cover-letter assistant that compiles evidence-backed documents."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Nuwan Samaranayake" }]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "sqlalchemy>=2",
    "psycopg[binary]",
    "alembic",
    "redis",
    "httpx",
    "aignite-groundwork @ git+https://github.com/nuwansamaranayake/groundwork@v0.1.0",
    "sentence-transformers",
    "python-docx",
    "pypdf",
    "ortools",
    "boto3",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Pin the ruleset explicitly: CI installs latest ruff, and default-select churn between
# ruff releases must not be able to redefine what "lint passes" means for this repo.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
