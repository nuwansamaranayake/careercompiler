name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install groundwork + app
        run: |
          python -m pip install --upgrade pip
          # groundwork resolves from a published wheel / git ref once the repos are pushed.
          pip install "aignite-groundwork @ git+https://github.com/AiGNITE/groundwork@main" \
            || echo "groundwork not yet published; falling back to minimal runtime deps"
          pip install -e ".[dev]" \
            || pip install fastapi "uvicorn[standard]" httpx pydantic pydantic-settings pytest
      - run: pytest

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create .env for compose (gitignored; CI uses the committed example)
        run: cp .env.example .env
      - name: Bring up the stack
        run: docker compose up -d --build
      - name: Assert image size (fires at 1.9 GB, ceiling is 2.0 — DECISIONS.md 003)
        run: python scripts/assert_image_size.py careercompiler-service
      - name: Image self-check, no network (git gone, CPU torch, model gates, pages served)
        run: docker run --rm --network none --entrypoint python careercompiler-service scripts/image_selfcheck.py
      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          echo "service did not become healthy" && docker compose logs && exit 1
      - name: Smoke against a real business endpoint
        run: |
          pip install httpx
          # token must match SMOKE_TEST_TOKEN in .env.example (the container's env in CI)
          API_HOST=127.0.0.1 API_PORT=8000 SMOKE_TEST_TOKEN=dev-smoke-token python scripts/smoke_test.py
      - name: Teardown
        if: always()
        run: docker compose down -v

  eval:
    name: "eval (required)"
    runs-on: ubuntu-latest
    # Golden analyzer suite against the EVAL.md thresholds. Deterministic (fixture fact
    # graph, hashing embedder), keyless, and REQUIRED: a miss on any bound fails the build.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pydantic>=2" httpx "aignite-groundwork @ git+https://github.com/nuwansamaranayake/groundwork@v0.1.1"
      - run: python scripts/eval.py

  quality:
    name: "quality gate (score floor 96, required)"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # scripts/quality_gate.py: lowest of backend and frontend coverage must reach 96, and
    # ruff, pytest, tsc, eslint, vitest, the frontend build and the browser suite must all
    # run and pass. The browser suite uses the real entailment model at the revision the
    # Dockerfile pins, with a scripted LLM, so this job needs no API key and spends nothing.
    env:
      HF_HOME: ${{ github.workspace }}/data/local/hf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the app, the gate's tools, and the entailment runtime (CPU wheels)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,e2e]"
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            "torch==2.13.0" "transformers==5.14.1"
          python -m playwright install --with-deps chromium
      - name: Fetch the pinned entailment weights (same revision the image bakes)
        run: |
          python -c "from huggingface_hub import snapshot_download as d; \
          d('MoritzLaurer/DeBERTa-v3-base-mnli-fever-anli', \
            revision='6f5cf0a2b59cabb106aca4c287eed12e357e90eb')"
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
        working-directory: web
      - name: Quality gate
        run: python scripts/quality_gate.py
      - name: Keep the gate's logs when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-logs
          path: data/local/gate/
